<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Thought studio — John Owolabi</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script src="/writer-theme.js?v=20261025-1"></script>
    <link rel="stylesheet" href="/styles.css?v=20261025-6" />
    <link rel="stylesheet" href="/writer.css?v=20261025-3" />
  </head>
  <body class="writer-room">
    <main class="create-container">
      <h1>Your carousel workspace has moved.</h1>
      <p>Opening this thought in your studio…</p>
      <p><a id="studio-link" href="/studio">Open thought studio →</a></p>
    </main>
    <script>
      const incoming = new URLSearchParams(location.search);
      const target = new URL("/studio", location.origin);
      for (const key of ["post", "slug", "asset"]) {
        if (incoming.has(key)) target.searchParams.set(key, incoming.get(key));
      }
      target.searchParams.set("format", "carousel");
      document.getElementById("studio-link").href = target.href;
      location.replace(target.href);
    </script>
  </body>
</html>
