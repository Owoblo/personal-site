name: Refresh social preview cards
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - posts.json
      - scripts/build-static.mjs
      - functions/_lib/render-post.mjs
      - .github/workflows/social-cards.yml
permissions:
  contents: write
concurrency:
  group: social-preview-cards
  cancel-in-progress: true
jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Save published preview cards
        shell: bash
        run: |
          mkdir -p og
          cp dist/og/*.png og/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add og
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh published social preview cards'
          git push
